name: Rust

on:
  push:
    branches: ["main", "next", "rrd-0.2.x", "rrd-0.3.x"]
  pull_request:
    branches: ["main", "rrd-0.2.x", "rrd-0.3.x"]

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:${{ matrix.version }}
    strategy:
      matrix:
        version: ["20.04", "22.04", "24.04", "25.04", "25.10", "26.04", "26.10"]
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -qy librrd-dev curl build-essential pkg-config libclang-dev
      - name: Quick check
        uses: ./.github/actions/quick-check
        with:
          locking_mode: ${{ contains(fromJSON('["26.04","26.10"]'), matrix.version) && 'true' || 'false' }}
  fedora:
    runs-on: ubuntu-latest
    container:
      image: fedora:${{ matrix.version }}
    strategy:
      matrix:
        version: ["43", "44", "45", "46"]
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: |
          dnf group install -qy --refresh c-development
          dnf install -qy rrdtool-devel curl clang
      - name: Quick check
        uses: ./.github/actions/quick-check
        with:
          locking_mode: "true"
  arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm rrdtool clang pkgconfig
      - name: Quick check
        uses: ./.github/actions/quick-check
        with:
          locking_mode: "true"
