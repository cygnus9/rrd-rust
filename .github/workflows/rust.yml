name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:${{ matrix.version }}
    strategy:
      matrix:
        version: ["20.04", "22.04", "24.04", "25.04", "25.10", "26.04"]
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
    steps:
    - uses: actions/checkout@v3
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -qy librrd-dev curl build-essential pkg-config libclang-dev
    - name: Quick check
      uses: ./.github/actions/quick-check
      with:
        locking_mode: ${{ matrix.version == '26.04' && 'true' || 'false' }}
  fedora:
    runs-on: ubuntu-latest
    container:
      image: fedora:${{ matrix.version }}
    strategy:
      matrix:
        version: ["42", "43", "44", "45"]
    steps:
    - uses: actions/checkout@v3
    - name: Install dependencies
      run: |
        dnf group install -qy --refresh c-development
        dnf install -qy rrdtool-devel curl clang
    - name: Quick check
      uses: ./.github/actions/quick-check
      with:
        locking_mode: 'true'
  arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
    - uses: actions/checkout@v3
    - name: Install dependencies
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm rrdtool clang pkgconfig
    - name: Quick check
      uses: ./.github/actions/quick-check
      with:
        locking_mode: 'true'
  opensuse-tumbleweed:
    runs-on: ubuntu-latest
    container:
      image: opensuse/tumbleweed:latest
    steps:
    - uses: actions/checkout@v3
    - name: Install dependencies
      run: |
        zypper refresh
        zypper install -y rrdtool-devel clang pkg-config
    - name: Quick check
      uses: ./.github/actions/quick-check
      with:
        locking_mode: 'true'
  opensuse-leap:
    runs-on: ubuntu-latest
    container:
      image: opensuse/leap:${{ matrix.version }}
    strategy:
      matrix:
        version: ["15.6", "16.0"]
    steps:
    - uses: actions/checkout@v3
    - name: Install dependencies
      run: |
        zypper refresh
        zypper install -y -t pattern devel_basis
        zypper install -y rrdtool-devel clang
    - name: Quick check
      uses: ./.github/actions/quick-check
      with:
        locking_mode: ${{ matrix.version == '15.6' && 'false' || 'true' }}
